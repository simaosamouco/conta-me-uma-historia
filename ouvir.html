<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ouvir · Conta-me Uma História</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="ouvir">
  <div data-header></div>

  <main class="wrap" style="padding-bottom: 96px;">
    <header class="page-head">
      <p class="eyebrow">Áudio-histórias</p>
      <h1>Ouve uma história!</h1>
      <p>Cada áudio-história tem efeitos especiais que ajudam a criar o ambiente, e uma pequena banda sonora com a mesma finalidade.</p>
    </header>

    <div class="tip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="2" y="14" width="5" height="7" rx="1.5"/><rect x="17" y="14" width="5" height="7" rx="1.5"/></svg>
      <span>Para aproveitares melhor o som, usa auriculares ou auscultadores.</span>
    </div>

    <ol class="tracks" id="tracks"></ol>
  </main>

  <div data-footer></div>

  <script src="assets/data.js"></script>
  <script src="assets/site.js"></script>
  <script>
    // A lista usa o leitor partilhado (Player, em site.js), que continua a tocar ao mudar de página.
    const list = document.getElementById("tracks");
    list.innerHTML = AUDIO.map((a, i) => `
      <li class="track" data-i="${i}">
        <button class="play" aria-label="Ouvir ${a.title}">${ICONS.play}</button>
        <span class="t">${a.title}${a.note ? `<small>${a.note}</small>` : ""}</span>
        <span class="d">${a.duration}</span>
        <div class="bar" aria-hidden="true"><span></span></div>
      </li>`).join("");

    const trackOf = (li) => {
      const a = AUDIO[li.dataset.i];
      return { title: a.title, src: a.src, duration: a.duration };
    };

    list.addEventListener("click", (e) => {
      const li = e.target.closest(".track");
      if (!li) return;
      const isCurrent = Player.current?.src === AUDIO[li.dataset.i].src;

      const bar = e.target.closest(".bar");
      if (bar && isCurrent) {
        const r = bar.getBoundingClientRect();
        Player.seek((e.clientX - r.left) / r.width);
        return;
      }
      if (!e.target.closest(".play")) return;
      isCurrent ? Player.toggle() : Player.play(trackOf(li));
    });

    Player.subscribe((s) => {
      list.querySelectorAll(".track").forEach((li) => {
        const a = AUDIO[li.dataset.i];
        const mine = s.track && s.track.src === a.src;
        li.classList.toggle("playing", mine && s.playing);
        li.classList.toggle("paused", mine && !s.playing);
        const btn = li.querySelector(".play");
        const on = String(mine && s.playing);
        if (btn.dataset.state !== on) {
          btn.dataset.state = on;
          btn.innerHTML = on === "true" ? ICONS.pause : ICONS.play;
          btn.setAttribute("aria-label", `${on === "true" ? "Pausa" : "Ouvir"} ${a.title}`);
        }
        li.querySelector(".d").textContent = mine && s.time ? `${formatTime(s.time)} / ${a.duration}` : a.duration;
        li.querySelector(".bar span").style.width = mine && s.duration ? `${(s.time / s.duration) * 100}%` : "0";
      });
    }, window.pageSignal);
  </script>
</body>
</html>
